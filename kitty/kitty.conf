# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size		 14
# END_KITTY_FONTS

# BEGIN_TEXT_CURSOR
cursor_shape			beam
cursor_shape_unfocused	unchanged
cursor_beam_thickness	2
# END_TEXT_CURSOR

# BEGIN_MOUSE
url_color	#00FF00
url_style	curly
show_hyperlink_targets yes
underline_hyperlinks always
copy_on_select no
strip_trailing_spaces smart
# END_MOUSE

# BEGIN_WINDOW_LAYOUT
single_window_margin_width 10
# END_WINDOW_LAYOUT

# BEGIN_COLOR_SCHEME
foreground #bec6d0
background #0f1215
selection_background #c7910c
selection_foreground #bec6d0

color0 #111418
color8 #bec6d0

color1 #e35535
color9 #ff4319

color2 #00a884
color10 #00a884

color3 #c7910c
color11 #d39600

color4 #11b7d4
color12 #00c3e5

color5 #d46ec0
color13 #f052d1

color6 #12edde
color14 #38c7bd

color7 #bec6d0
color15 #f9fafb

background_opacity 0.8
background_blur 20
